<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Arduino Simulator</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <h2>Virtual Arduino Simulator</h2>

      <div class="workspace">
        <div class="editor-panel">
          <label><strong>Sketch</strong></label>
          <textarea id="code">
void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);
  delay(500);
  digitalWrite(13, LOW);
  delay(500);
}
</textarea
          >

          <div class="toolbar">
            <button class="btn" id="runBtn">Run</button>
            <button class="btn secondary" id="stopBtn">Stop</button>
            <button class="btn secondary small" id="clearSerialBtn">
              Clear Serial
            </button>
            <button class="btn secondary small" id="copyCodeBtn">
              Copy Code
            </button>
            <div style="flex: 1"></div>
            <div class="status" id="status">Status: Stopped</div>
          </div>
        </div>

        <div class="sim-panel">
          <div style="text-align: center">
            <div id="led" class="led" aria-hidden="true"></div>
            <div style="font-size: 13px; color: var(--muted)">Pin 13 (LED)</div>
            <div id="led-pwm" style="font-size: 12px; color: var(--muted)">
              PWM: 0
            </div>
          </div>

          <div style="margin-top: 12px">
            <h4 style="margin: 0 0 8px">Pin States</h4>
            <div id="pin-table"></div>
          </div>
          <div style="margin-top: 12px">
            <h4 style="margin: 0 0 8px">Inputs</h4>
            <div style="display: flex; gap: 12px; align-items: center">
              <div>
                <div style="display: flex; gap: 8px; align-items: center">
                  <button id="btn-2" class="btn secondary">
                    Button (pin 2)
                  </button>
                  <div
                    id="btn-2-state"
                    style="font-size: 12px; color: var(--muted)"
                  >
                    LOW
                  </div>
                </div>
                <div style="font-size: 12px; color: var(--muted)">
                  Hold to set HIGH
                </div>
              </div>
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 6px;
                  margin-left: 14px;
                "
              >
                <label style="font-size: 13px; margin: 0">Analog A0</label>
                <div style="display: flex; gap: 8px; align-items: center">
                  <input
                    id="slider-a0"
                    type="range"
                    min="0"
                    max="1023"
                    value="0"
                  />
                  <div
                    id="a0-val"
                    style="
                      width: 42px;
                      font-size: 12px;
                      color: var(--muted);
                      text-align: right;
                    "
                  >
                    0
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div style="margin-top: 12px">
            <h4 style="margin: 0 0 8px">Serial Console</h4>
            <div id="serial"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { wireButtons } from "./ui.js";

      document.addEventListener("DOMContentLoaded", () => {
        wireButtons();
      });
    </script>
  </body>
</html>
