<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Arduino Simulator</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div class="app">
      <h2>Virtual Arduino Simulator</h2>

      <div class="workspace">
        <div class="editor-panel">
          <label for="code"><strong>Sketch</strong></label>
          <textarea id="code">
void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);
  delay(500);
  digitalWrite(13, LOW);
  delay(500);
}
</textarea
          >

          <div class="toolbar">
            <button class="btn" id="runBtn">Run</button>
            <button class="btn secondary" id="stopBtn">Stop</button>
            <button class="btn secondary small" id="clearSerialBtn">
              Clear Serial
            </button>
            <button class="btn secondary small" id="copyCodeBtn">
              Copy Code
            </button>
            <div class="spacer"></div>
            <div class="status" id="status">Status: Stopped</div>
          </div>
        </div>

        <div class="sim-panel">
          <div class="led-block">
            <div id="led" class="led" aria-hidden="true"></div>
            <div class="caption">Pin 13 (LED)</div>
            <div id="led-pwm" class="hint">PWM: 0</div>
          </div>

          <section class="section">
            <h4>Pin States</h4>
            <div id="pin-table"></div>
          </section>

          <section class="section">
            <h4>Inputs</h4>
            <div class="inputs">
              <div>
                <div class="row">
                  <button id="btn-2" class="btn secondary">
                    Button (pin 2)
                  </button>
                  <div id="btn-2-state" class="hint">LOW</div>
                </div>
                <div class="hint">Hold to set HIGH</div>
              </div>
              <div class="analog-input">
                <label for="slider-a0" class="input-label">Analog A0</label>
                <div class="row">
                  <input
                    id="slider-a0"
                    type="range"
                    min="0"
                    max="1023"
                    value="0"
                  />
                  <div id="a0-val" class="hint slider-value">0</div>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <h4>Serial Console</h4>
            <div id="serial"></div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/src/ui/ui.js"></script>
  </body>
</html>
